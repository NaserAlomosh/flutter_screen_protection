name: flutter_screen_protection
description: Android screenshot policy using global configuration and Flutter route names.
version: 0.1.0
repository: https://github.com/NaserAlomosh/flutter_screen_protection
environment:
  sdk: ^3.9.2
  flutter: '>=3.35.4'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.naseralomosh.flutter_screen_protection
        pluginClass: FlutterScreenProtectionPlugin
